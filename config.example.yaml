domain: ""
listen_https: ":443"
listen_http: ":80"
dev_http: "127.0.0.1:8080"
db_path: "./data/screener.db"

cycles:
  fast_interval: 15m
  slow_interval: 2h

settings:
  min_volume_usd: 100000000
  min_change_pct: 20
  enable_change_filter: true
  corr_threshold: 0.8
  inplay:
    market_threshold_pct: 3
    multiplier: 2
  weights:
    volatility: 0.4
    turnover: 0.3
    inplay: 0.2
    corr: 0.1
  top_n: 20

blacklist:
  - USDC
  - TUSD

normalization_overrides: {}

auth:
  bootstrap_email: "owner@example.com"
  bootstrap_password: "change-me-before-first-run"
